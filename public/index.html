<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Snap Archive</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0f14; --bg-deep:#070a0e; --panel:#141b24; --panel-2:#1a2330; --panel-3:#212c3b;
    --line:#25313f; --line-soft:#1b2531;
    --fg:#e6edf3; --dim:#8b98a5; --dim-2:#63707e;
    --acc:#4c9aff; --acc-dim:#1f4f8f; --ok:#3fb950; --warn:#e3b341; --bad:#f85149;
    --r:14px; --r-sm:10px;
    --slot-h:56px; --slot-gap:6px;          /* 槽位行高与间距：用于算"只露 3 行"的高度 */
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #101823 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    overscroll-behavior:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{
    min-height:46px;padding:0 14px;border-radius:var(--r-sm);
    background:linear-gradient(180deg,var(--panel-3),var(--panel-2));
    border:1px solid var(--line); color:var(--fg);
    font-size:14px;font-weight:600; letter-spacing:.2px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, filter .15s ease, border-color .15s ease;
  }
  .btn:active{transform:scale(.96);filter:brightness(1.15)}
  .btn.primary{background:linear-gradient(180deg,#2ea043,#238636);border-color:#2ea043;color:#fff}
  .btn.ghost{background:transparent;border-color:var(--line-soft);color:var(--dim)}
  .btn.warn{border-color:#5c4a1d;color:var(--warn)}
  .btn:disabled{opacity:.38;transform:none;filter:none}
  .btn.icon{min-width:46px;padding:0 10px;font-size:17px}

  /* ---------- 顶栏 ---------- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
    border-bottom:1px solid var(--line-soft);
    background:rgba(11,15,20,.72); backdrop-filter:blur(12px);
    position:relative; z-index:5;
  }
  .chip{flex:0 0 auto;min-height:44px;padding:0 10px;border-radius:var(--r-sm);
    background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border:1px solid var(--line);
    color:var(--fg);font-size:12px;font-weight:700;white-space:nowrap;transition:transform .08s ease}
  .chip:active{transform:scale(.94)}
  .chip[data-f="image"],.chip[data-f="video"]{border-color:var(--acc);color:var(--acc)}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg .btn{flex:1;min-height:42px;font-size:12.5px}
  .seg .btn.on{background:linear-gradient(180deg,#2f6fd0,#255bb0);border-color:#3b7de0;color:#fff}
  /* 视频中央的大播放键：移动端 preload=metadata 常常只显示黑框，需要明确的点击目标 */
  .playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    width:76px;height:76px;border-radius:50%;font-size:28px;color:#fff;line-height:1;
    background:rgba(10,14,20,.6);border:2px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
    transition:opacity .18s}
  .playbtn.hidden{opacity:0;pointer-events:none}
  .brand{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .brand b{font-size:14px;letter-spacing:.4px}
  .srcbtn{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    min-height:44px;padding:0 12px;border-radius:var(--r-sm);
    background:var(--panel);border:1px solid var(--line);text-align:left;
  }
  .srcbtn .ico{flex:0 0 auto;font-size:16px;opacity:.9}
  .srcbtn .t{flex:1;min-width:0}
  .srcbtn .t .n{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srcbtn .t .p{display:block;font-size:10.5px;color:var(--dim-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
  .sync{flex:0 0 auto;font-size:10.5px;color:var(--dim-2);min-width:52px;text-align:right;line-height:1.3}
  .sync.ok{color:var(--ok)} .sync.err{color:var(--bad)} .sync.on{color:var(--warn)}

  /* ---------- 主区 ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .stage{
    flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(45deg,#0a0e13 25%,transparent 25%,transparent 75%,#0a0e13 75%) 0 0/22px 22px,
      linear-gradient(45deg,#0a0e13 25%,transparent 25%,transparent 75%,#0a0e13 75%) 11px 11px/22px 22px,
      #0d1219;
    overflow:hidden;
  }
  .stage img,.stage video{max-width:100%;max-height:100%;object-fit:contain;display:block;
    animation:fade .22s ease}
  @keyframes fade{from{opacity:.25;transform:scale(.995)}to{opacity:1;transform:none}}
  .stage .hint{color:var(--dim);font-size:13px;text-align:center;padding:24px;line-height:2}
  .stage .hint .big{font-size:34px;display:block;margin-bottom:10px;opacity:.55}
  .spinner{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;
    animation:spin .8s linear infinite;opacity:0;pointer-events:none;transition:opacity .15s}
  .spinner.on{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .badge span{background:rgba(7,10,14,.72);backdrop-filter:blur(6px);border:1px solid var(--line-soft);
    border-radius:20px;padding:4px 10px;font-size:11px;color:var(--dim)}
  .empty-dirs{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;
    padding:8px;background:linear-gradient(0deg,rgba(7,10,14,.9),transparent)}
  .empty-dirs button{flex:0 0 auto;min-height:38px;font-size:12px;border-radius:20px;padding:0 12px;
    background:var(--panel);border:1px solid var(--line);color:var(--dim)}

  .film{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:7px 8px;border-top:1px solid var(--line-soft);
    scrollbar-width:none}
  .film::-webkit-scrollbar{display:none}
  .th{flex:0 0 auto;width:62px;height:62px;border-radius:var(--r-sm);border:1px solid var(--line);
    overflow:hidden;background:var(--panel);position:relative;padding:0}
  .th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
  .th.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(76,154,255,.35)}
  .th .v{position:absolute;right:3px;bottom:3px;font-size:9px;background:rgba(0,0,0,.65);
    border-radius:4px;padding:0 3px}
  .th.dir{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);
    line-height:1.15;text-align:center;padding:2px;background:var(--panel-2)}

  /* ---------- 底部槽位（20 个 = 4 列 × 5 行；默认只露 3 行，可上下滑） ---------- */
  footer{flex:0 0 auto;border-top:1px solid var(--line-soft);background:rgba(11,15,20,.85);backdrop-filter:blur(12px);
    padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  .slots-outer{position:relative}
  .slots-wrap{
    max-height:calc(3 * var(--slot-h) + 2 * var(--slot-gap));   /* 只露 3 行 */
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;                                 /* 别把滚动传给整页 */
    scrollbar-width:thin;
  }
  .slots-wrap::-webkit-scrollbar{width:4px}
  .slots-wrap::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px}
  /* 底部渐隐：提示"下面还有"（滑到底自动消失） */
  .slots-fade{position:absolute;left:0;right:4px;bottom:0;height:20px;pointer-events:none;
    background:linear-gradient(transparent,rgba(11,15,20,.92));opacity:0;transition:opacity .18s}
  .slots-fade.on{opacity:1}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--slot-gap)}
  .slot{
    position:relative;min-height:var(--slot-h);border-radius:var(--r-sm);padding:6px 6px 5px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:2px;overflow:hidden;
    transition:transform .08s ease, border-color .15s ease, filter .12s ease;
  }
  .slot:active{transform:scale(.95);filter:brightness(1.2)}
  .slot .n{font-size:12.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .c{font-size:10px;color:var(--dim-2)}
  .slot .k{position:absolute;top:3px;left:5px;font-size:9px;color:var(--dim-2)}
  .slot.empty{border-style:dashed;background:transparent}
  .slot.empty .n{color:var(--dim-2);font-weight:600}
  .slot.xdisk{border-color:#5c4a1d}
  .slot.xdisk .c{color:var(--warn)}
  .slot.flash{animation:flash .55s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(63,185,80,.75);border-color:var(--ok)}
    100%{box-shadow:0 0 0 16px rgba(63,185,80,0);border-color:var(--line)}
  }
  .tools{display:flex;gap:6px;margin-top:7px}
  .tools .btn{flex:1;font-size:12.5px}

  /* ---------- 抽屉 / 弹层 ---------- */
  .sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,7,11,.72);backdrop-filter:blur(4px);
    padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  .sheet.on{display:flex;flex-direction:column;animation:up .2s ease}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .card > h2{margin:0;padding:14px 16px;font-size:15px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line-soft)}
  .card > h2 .sp{flex:1}
  .card .body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
  .card .foot{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-soft)}
  .card .foot .btn{flex:1}
  .grp{font-size:11px;color:var(--dim-2);letter-spacing:.6px;margin:4px 0 8px;text-transform:uppercase}
  .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .item:last-child{border-bottom:0}
  .item .idx{flex:0 0 30px;font-size:11px;color:var(--dim-2);text-align:center}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .txt span{display:block;font-size:10.5px;color:var(--dim-2);word-break:break-all}
  .item .acts{flex:0 0 auto;display:flex;gap:5px}
  .item .acts .btn{min-height:34px;padding:0 9px;font-size:11.5px}
  /* 左侧勾选框：够大好点，且只有点它才是"选中"（点行的其它地方＝进入目录） */
  .item .ck{flex:0 0 42px;width:42px;height:42px;margin-right:2px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
    color:transparent;transition:transform .08s ease,background .15s ease}
  .item .ck:active{transform:scale(.9)}
  .item .ck.on{background:var(--acc);border-color:var(--acc);color:#04121f}
  .item .chev{flex:0 0 auto;color:var(--dim-2);font-size:22px;line-height:1;padding:0 6px}
  .picker{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .picker .ico{flex:0 0 auto;font-size:17px}
  .picker .txt{flex:1;min-width:0}
  .picker .txt b{font-size:13px}
  .picker .txt span{display:block;font-size:10.5px;color:var(--dim-2);word-break:break-all}
  .bar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .crumb{flex:1;min-width:0;font-size:11px;color:var(--dim);background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:var(--r-sm);padding:8px 10px;word-break:break-all;line-height:1.5}
  .pool{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);margin-left:4px}
  .pool.same{color:var(--ok);border-color:#1d3d24} .pool.diff{color:var(--warn);border-color:#5c4a1d}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
    bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
    background:rgba(26,35,48,.97);border:1px solid var(--line);border-radius:12px;
    padding:11px 16px;font-size:13px;max-width:90vw;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:#1d5c2a} .toast.err{border-color:#6e2b28;color:#ffb4ae} .toast.warn{border-color:#5c4a1d;color:#f0d089}
  .note{font-size:11.5px;color:var(--dim-2);line-height:1.9;padding:12px 2px 4px}
  .note b{color:var(--dim)}
</style>
</head>
<body>

<header>
  <button class="srcbtn" id="srcBtn">
    <span class="ico">📂</span>
    <span class="t"><span class="n" id="srcName">待分类目录</span><span class="p" id="srcPath">点这里选择</span></span>
    <span class="ico" style="opacity:.5">▾</span>
  </button>
  <button class="chip" id="filterChip" data-f="all" title="切换媒体类型（图片 / 视频 / 两者）">图+视</button>
  <div class="sync" id="sync">—</div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="spinner" id="spin"></div>
    <div class="hint" id="hint"><span class="big">🖼️</span>先选一个「待分类」目录<br>然后在下面配置目标目录</div>
    <div class="badge" id="badge"></div>
    <div class="empty-dirs" id="quickDirs"></div>
  </div>
  <div class="film" id="film"></div>
</main>

<footer>
  <div class="slots-outer">
    <div class="slots-wrap" id="slotsWrap"><div class="slots" id="slots"></div></div>
    <div class="slots-fade" id="slotsFade"></div>
  </div>
  <div class="tools">
    <button class="btn" id="undo">↶ 撤销</button>
    <button class="btn" id="discard">🗑 丢弃</button>
    <button class="btn primary" id="setup">⚙ 设置</button>
  </div>
</footer>

<!-- ============ 设置面板 ============ -->
<div class="sheet" id="setupSheet">
  <div class="card">
    <h2><span>⚙ 目录设置</span><span class="sp"></span><button class="btn ghost icon" data-close="setupSheet">✕</button></h2>
    <div class="body">
      <div class="grp">媒体类型</div>
      <div class="seg">
        <button class="btn" id="filter_all">图片 + 视频</button>
        <button class="btn" id="filter_image">仅图片</button>
        <button class="btn" id="filter_video">仅视频</button>
      </div>

      <div class="grp">待分类目录（源）</div>
      <div id="setupSource"></div>

      <div class="grp" style="margin-top:18px">目标目录（12 个槽位）</div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <button class="btn" id="batchBtn" style="flex:1">☑ 批量勾选子目录</button>
        <button class="btn ghost" id="fillBtn" style="flex:0 0 auto">用当前目录填充空槽</button>
      </div>
      <div id="setupTargets"></div>

      <div class="grp" style="margin-top:18px">丢弃目录</div>
      <div id="setupDel"></div>

      <div class="note" id="setupNote"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="clearAll">全部清空</button>
      <button class="btn" id="reloadCfg">重新读取</button>
      <button class="btn primary" data-close="setupSheet">完成</button>
    </div>
  </div>
</div>

<!-- ============ 目录浏览器（选源 / 选槽位 / 批量勾选） ============ -->
<div class="sheet" id="browseSheet">
  <div class="card">
    <h2><span id="browseTitle">选择目录</span><span class="sp"></span><button class="btn ghost icon" data-close="browseSheet">✕</button></h2>
    <div class="body">
      <div class="bar">
        <button class="btn icon" id="bUp">↑</button>
        <button class="btn icon" id="bHome">⌂</button>
        <button class="btn icon" id="bReload">↻</button>
      </div>
      <div class="crumb" id="bCrumb"></div>
      <div id="bHint" class="note" style="padding:8px 2px"></div>
      <div id="bList"></div>
    </div>
    <div class="foot" id="bFoot">
      <button class="btn ghost" data-close="browseSheet">取消</button>
      <button class="btn primary" id="bConfirm">选定此目录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ==========================================================================
 * Snap Archive · 零服务端版（路线 B）
 *
 * 文件操作全部走同源 WebDAV：PROPFIND 列目录 / GET 取图 / MOVE 分类 / COPY+DELETE 跨盘兜底
 * 配置存到 NAS：与本页同目录的 snap-config.json（PUT/GET），换设备换浏览器都能沿用
 *
 * 三条写死的安全规则：
 *   ① 一切写操作都带 Overwrite: F —— 目标同名时服务器返回 412，绝不覆盖（已实测）
 *   ② 跨盘时「COPY → 校验大小 → 才 DELETE 源」，校验不过保留源文件并报错
 *   ③ 只移动、不删除文件；「丢弃」也只是移到你指定的目录
 * ==========================================================================*/

const ORIGIN = location.origin;
const DIR = location.pathname.replace(/[^/]*$/, '');       // 本页所在目录（编码）
const CFG_URL = ORIGIN + DIR + 'snap-config.json';   // 绝对 URL：页面若从带凭据的 URL 打开，相对 URL 会让 fetch 直接抛错
const CFG_LS = 'snap.config.cache';
const FILTER_LS = 'snap.filter';
const $ = (id) => document.getElementById(id);
const IMG = new Set(['jpg','jpeg','png','gif','webp','avif','bmp']);
const VID = new Set(['mp4','webm']);
const SLOT_N = 20;                              // 4 列 × 5 行；底部默认只露 3 行，可上下滑

const dec = decodeURIComponent;
const enc = encodeURIComponent;
const extOf = (n) => { const i = n.lastIndexOf('.'); return i<0 ? '' : n.slice(i+1).toLowerCase(); };
const baseOf = (h) => { const t = String(h).replace(/\/$/,''); return dec(t.slice(t.lastIndexOf('/')+1)); };
const parentOf = (h) => { const p = h.replace(/\/$/,'').split('/'); p.pop(); return p.join('/')+'/'; };
const human = (n) => n>1048576 ? (n/1048576).toFixed(1)+'MB' : n>1024 ? Math.round(n/1024)+'KB' : n+'B';
const joinEnc = (dir, name) => dir + enc(name);
/** 挂载点 = WebDAV 路径第一段。极空间每个存储池是一个挂载点；实测跨挂载点 MOVE 会 405 */
const poolOf = (p) => dec(String(p||'/').replace(/^\//,'').split('/')[0] || '/');
const esc = (s) => String(s).replace(/[&<>"]/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const labelOf = (path) => dec(String(path).replace(/\/$/,'').split('/').pop() || '/');

const S = {
  cwd: null, raw: [], files: [], dirs: [], index: 0, filter: 'all',
  source: null, targets: new Array(SLOT_N).fill(null), del: null,
  last: null, busy: false, counts: {},
  pick: { mode:'source', slot:-1, dir:'/', chosen:new Set() },
  dirty: false, saving: false,
};

/* ---------------- 提示 ---------------- */
function toast(msg, kind, ms) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + (kind||'');
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className='toast'; }, ms || 3000);
}
function setSync(state, text) {
  const el = $('sync'); el.className = 'sync ' + (state||''); el.textContent = text;
}

/* ---------------- WebDAV 原语 ---------------- */
async function propfind(path, depth) {
  const body = '<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop>'
    + '<d:getcontentlength/><d:getlastmodified/><d:resourcetype/></d:prop></d:propfind>';
  const r = await fetch(path, { method:'PROPFIND', credentials:'same-origin',
    headers:{ 'Depth': String(depth==null?1:depth), 'Content-Type':'application/xml; charset=utf-8' }, body });
  if (r.status === 401) throw new Error('认证失败：重新输入 NAS 账号密码后刷新页面');
  if (r.status === 404) return null;
  if (r.status !== 207) throw new Error('列目录失败 HTTP ' + r.status);
  const xml = new DOMParser().parseFromString(await r.text(), 'application/xml');
  const out = [];
  for (const resp of xml.getElementsByTagNameNS('DAV:','response')) {
    const h = resp.getElementsByTagNameNS('DAV:','href')[0];
    if (!h) continue;
    const href = h.textContent.trim();
    const isDir = resp.getElementsByTagNameNS('DAV:','collection').length > 0;
    const len = resp.getElementsByTagNameNS('DAV:','getcontentlength')[0];
    const mod = resp.getElementsByTagNameNS('DAV:','getlastmodified')[0];
    out.push({ href: isDir && !href.endsWith('/') ? href + '/' : href, dir: isDir,
      name: baseOf(href), size: len ? Number(len.textContent||0) : 0,
      mtime: mod ? Date.parse(mod.textContent) : 0 });
  }
  return out;
}
const statOf = async (p) => { const l = await propfind(p, 0); return l && l[0] ? l[0] : null; };
async function listDirs(dir) {
  const l = await propfind(ORIGIN + dir, 1);
  if (!l) return null;
  return l.filter((e) => e.dir && e.href !== dir);
}

/**
 * 把 srcHref 放到 destDir。
 * 先 MOVE（同盘，快且原子）；若服务器 405（跨盘无法 rename）则退化为 COPY + 校验 + DELETE。
 * 目标同名一律靠 Overwrite: F 得到 412，再换名重试 —— 绝不覆盖。
 */
async function place(srcHref, srcName, srcSize, destDir) {
  const attempt = async (method) => {
    const dot = srcName.lastIndexOf('.');
    const stem = dot>0 ? srcName.slice(0,dot) : srcName;
    const suffix = dot>0 ? srcName.slice(dot) : '';
    for (let i=0;i<50;i++) {
      const finalName = i===0 ? srcName : `${stem} (${i})${suffix}`;
      const destHref = joinEnc(destDir, finalName);
      const r = await fetch(srcHref, { method, credentials:'same-origin',
        headers:{ 'Destination': ORIGIN + destHref, 'Overwrite':'F' } });
      if (r.status>=200 && r.status<300) return { ok:true, finalName, destHref };
      if (r.status===412) continue;
      return { ok:false, status:r.status, body:(await r.text()).slice(0,140) };
    }
    throw new Error('同名文件过多（已试 50 个名字）');
  };

  const mv = await attempt('MOVE');
  if (mv.ok) return { ...mv, mode:'move' };

  if (mv.status === 405 || mv.status === 502 || mv.status === 500) {
    const cp = await attempt('COPY');
    if (!cp.ok) throw new Error(`跨盘复制失败 HTTP ${cp.status} ${cp.body||''}`);
    const info = await statOf(ORIGIN + cp.destHref);
    if (!info || info.dir) throw new Error('复制后目标不存在 —— 已保留源文件，未删除');
    if (srcSize > 0 && info.size !== srcSize)
      throw new Error(`复制后大小不一致（源 ${srcSize} / 目标 ${info.size}）—— 已保留源文件，未删除`);
    const d = await fetch(srcHref, { method:'DELETE', credentials:'same-origin' });
    if (d.status !== 204 && d.status !== 200)
      throw new Error('复制成功但删除源失败：目标已有副本、源仍在，请手动处理');
    return { ...cp, mode:'copy' };
  }
  throw new Error(`移动失败 HTTP ${mv.status} ${mv.body||''}`);
}

/* ---------------- 配置：存在 NAS 上 ---------------- */
function snapshot() {
  return { version:1, source:S.source, targets:S.targets, del:S.del, filter:S.filter, updated:new Date().toISOString() };
}
function applyConfig(c) {
  if (!c || typeof c !== 'object') return false;
  if (c.source && c.source.path) S.source = { path:c.source.path, name:c.source.name || labelOf(c.source.path) };
  if (Array.isArray(c.targets)) {
    S.targets = c.targets.slice(0,SLOT_N)
      .map((t) => (t && t.path) ? { path:t.path, name:t.name || labelOf(t.path) } : null)
      .concat(new Array(SLOT_N).fill(null)).slice(0,SLOT_N);
  }
  if (c.del && c.del.path) S.del = { path:c.del.path, name:c.del.name || labelOf(c.del.path) };
  if (c.filter && ['all','image','video'].includes(c.filter)) S.filter = c.filter;
  return true;
}
async function loadConfig() {
  try {
    const r = await fetch(CFG_URL + '?t=' + Date.now(), { credentials:'same-origin', cache:'no-store' });
    if (r.ok) {
      const c = JSON.parse(await r.text());
      applyConfig(c);
      setSync('ok', '配置已载入');
      return true;
    }
    if (r.status === 404) { setSync('', '首次使用'); return false; }
    setSync('err', '读取失败 ' + r.status);
  } catch (e) {
    // 退回浏览器缓存，至少别丢配置
    try { applyConfig(JSON.parse(localStorage.getItem(CFG_LS) || 'null')); } catch(_) {}
    setSync('err', '读取失败');
  }
  return false;
}
let saveTimer = null;
function scheduleSave() {
  S.dirty = true; setSync('on', '待保存…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveConfig, 500);
  try { localStorage.setItem(CFG_LS, JSON.stringify(snapshot())); } catch(e){}
}
async function saveConfig() {
  if (S.saving) { scheduleSave(); return; }
  S.saving = true; setSync('on', '保存中…');
  try {
    const r = await fetch(CFG_URL, { method:'PUT', credentials:'same-origin',
      headers:{ 'Content-Type':'application/json; charset=utf-8' },
      body: JSON.stringify(snapshot(), null, 2) });
    if (!(r.status>=200 && r.status<300)) throw new Error('HTTP ' + r.status);
    S.dirty = false;
    setSync('ok', '已存到 NAS');
    try { localStorage.setItem(CFG_LS, JSON.stringify(snapshot())); } catch(e){}
  } catch (e) {
    setSync('err', '保存失败');
    toast('配置没能保存到 NAS：' + e.message + '（下次打开可能丢失）', 'err', 5000);
  } finally { S.saving = false; }
}

/* ---------------- 浏览源目录 ---------------- */
async function openSource(dir) {
  if (S.busy) return;
  S.busy = true;
  setSync(S.dirty ? 'on' : '', S.dirty ? '待保存…' : '读取中…');
  try {
    const list = await propfind(ORIGIN + dir, 1);
    if (!list) throw new Error('目录不存在');
    const items = list.filter((e) => e.href !== dir && e.href !== dir.replace(/\/$/,''));
    S.cwd = dir.endsWith('/') ? dir : dir + '/';
    S.dirs = items.filter((e) => e.dir);
    S.raw = items.filter((e) => !e.dir && (IMG.has(extOf(e.name)) || VID.has(extOf(e.name))));
    S.raw.sort((a,b) => b.mtime - a.mtime);
    applyFilter(false);
    if (!S.dirty) setSync('', '已同步');
  } catch (e) {
    toast(e.message, 'err', 5000);
    setSync('err', '读取失败');
  } finally { S.busy = false; }
}

/* 媒体类型筛选：all=图片+视频 / image=仅图片 / video=仅视频
   S.raw 是目录里的全部媒体，S.files 是筛选后的结果 */
function applyFilter(keepCurrent = true) {
  const cur = keepCurrent ? S.files[S.index] : null;
  const f = S.filter;
  S.files = S.raw.filter((e) => f === 'all' ? true
    : f === 'image' ? IMG.has(extOf(e.name)) : VID.has(extOf(e.name)));
  let i = cur ? S.files.findIndex((e) => e.href === cur.href) : -1;
  if (i < 0) i = Math.min(S.index, Math.max(0, S.files.length - 1));
  S.index = i;
  updateFilterUI();
  render();
  preload();
}

function updateFilterUI() {
  const label = { all:'图+视', image:'仅图片', video:'仅视频' }[S.filter] || '图+视';
  const chip = $('filterChip');
  if (chip) { chip.textContent = label; chip.dataset.f = S.filter; }
  ['all','image','video'].forEach((k) => {
    const b = $('filter_' + k);
    if (b) b.classList.toggle('on', S.filter === k);
  });
}

function setFilter(f) {
  if (!['all','image','video'].includes(f)) f = 'all';
  S.filter = f;
  try { localStorage.setItem(FILTER_LS, f); } catch(e){}
  applyFilter(true);
  scheduleSave();                       // 顺手存进 NAS 上的配置
  toast('媒体类型：' + ({all:'图片 + 视频', image:'仅图片', video:'仅视频'}[f]), 'ok', 1400);
}

function preload() {
  for (const i of [S.index+1, S.index+2, S.index-1]) {
    const f = S.files[i];
    if (f && IMG.has(extOf(f.name))) { const im = new Image(); im.src = f.href; }
  }
}

/* ---------------- 渲染 ---------------- */
function render() {

}

function renderHeader() {

function renderStage() {
  const st = $('stage');
  // 清掉上一张图/视频与播放键，保留 spinner / hint / badge / quickDirs
  st.querySelectorAll('img,video,.playbtn').forEach((n)=>n.remove());
  const hint = $('hint');

    hint.style.display = '';

      hint.innerHTML = `<span class="big">🖼️</span>先选一个「待分类」目录<br>然后在下面配置目标目录`;
    } else if (S.raw.length) {
      hint.innerHTML = `<span class="big">🔍</span>当前筛选（仅${fname}）下没有文件<br>`
        + `这个目录另有 <b>${S.raw.length}</b> 个其它媒体<br>点右上角的媒体类型按钮可切换`;
    } else {
      hint.innerHTML = `<span class="big">🖼️</span>这个目录里没有图片或视频<br>用「⚙ 设置」换目录，或点上面的子目录`;
    }
    renderBadge(null);
    if (S.dirs.length) {
      S.dirs.slice(0,12).forEach((d) => {
        const b = document.createElement('button');

      });

  hint.style.display = 'none';

  const el = document.createElement(isV ? 'video' : 'img');
  el.src = isV ? f.href + '#t=0.1' : f.href;      // #t=0.1 让移动端也能画出首帧
  if (isV) { el.controls = true; el.playsInline = true; el.preload = 'metadata'; }
  const spin = $('spin'); spin.classList.add('on');
  const done = () => spin.classList.remove('on');
  el.addEventListener('load', done); el.addEventListener('loadeddata', done); el.addEventListener('error', done);

  if (isV) {
    const pb = document.createElement('button');
    pb.className = 'playbtn'; pb.type = 'button'; pb.textContent = '▶';

    el.addEventListener('pause', () => pb.classList.remove('hidden'));
    el.addEventListener('ended', () => pb.classList.remove('hidden'));
    st.insertBefore(pb, $('badge'));
  }
  renderBadge(f);
}

function renderBadge(f) {

function renderFilm() {
  const box = $('film'); box.innerHTML = '';
  S.dirs.forEach((d) => {
    const b = document.createElement('button');

  });
  S.files.forEach((f, i) => {

/* 槽位按钮只创建一次，之后一律"原地更新"。
   这点很重要：如果每次移动都 innerHTML='' 重建，清空的瞬间内容高度归零，
   浏览器会把滚动位置钳回顶部 —— 用户滑到第 4、5 行点一下就被弹回去。 */
let slotEls = [];
function buildSlots() {
  const box = $('slots'); box.innerHTML = '';
  slotEls = [];
  for (let i = 0; i < SLOT_N; i++) {
    const b = document.createElement('button');
    b.className = 'slot empty';
    b.dataset.slot = String(i);
    b.innerHTML = `<span class="k">${i+1}</span><span class="n"></span><span class="c"></span>`;
    b.onclick = () => { const t = S.targets[i]; t ? classify(t, b) : openPicker('slot', i); };
    b.oncontextmenu = (e) => { e.preventDefault(); openPicker('slot', i); };
    box.append(b);
    slotEls.push(b);
  }
  updateSlotsFade();
}

function renderSlots() {
  const srcPool = S.cwd ? poolOf(S.cwd) : null;
  S.targets.forEach((t, i) => {
    const b = slotEls[i];
    if (!b) return;
    const xd = !!(t && srcPool && poolOf(t.path) !== srcPool);
    b.className = 'slot' + (t ? '' : ' empty') + (xd ? ' xdisk' : '');
    b.querySelector('.n').textContent = t ? t.name : '未设置';
    b.querySelector('.c').textContent = xd ? '⚠ 跨盘'
      : (t ? (S.counts[t.path] != null ? S.counts[t.path] + ' 个' : '…') : '');
  });
  $('undo').disabled = !S.last;
  $('discard').disabled = false;
  updateSlotsFade();
}

/** 还有内容没露出来时，底部显示一层渐隐提示 */
function updateSlotsFade() {
  const w = $('slotsWrap'), f = $('slotsFade');
  if (!w || !f) return;
  f.classList.toggle('on', (w.scrollHeight - w.clientHeight - w.scrollTop) > 4);
}

/* ---------------- 分类 ---------------- */
async function classify(target, slotEl) {
  if (S.busy) return;
  const f = S.files[S.index];
  if (!f) { toast('这个目录里没有可分类的图片', 'warn'); return; }
  S.busy = true;
  try {
    const destDir = target.path.endsWith('/') ? target.path : target.path + '/';
    const res = await place(f.href, f.name, f.size, destDir);
    S.last = { backDir: S.cwd, name: res.finalName, from: res.destHref, mode: res.mode };
    if (S.counts[target.path] != null) S.counts[target.path] += 1;
    if (navigator.vibrate) navigator.vibrate(12);
    const renamed = res.finalName !== f.name;
    toast(`已移到「${target.name}」${renamed ? '，改名为 ' + res.finalName : ''}${res.mode==='copy' ? '（跨盘复制）' : ''}`, 'ok', 1800);
    S.files.splice(S.index, 1);
    if (S.index >= S.files.length) S.index = Math.max(0, S.files.length-1);
    render(); preload();
    // 闪光必须放在 render 之后：renderSlots 会重设 className，先加会被冲掉
    if (slotEl) {
      slotEl.classList.add('flash');
      setTimeout(() => slotEl.classList.remove('flash'), 600);
    }
    updateSlotsFade();      // 计数文字变化可能影响是否需要滚动提示
  } catch (e) {
    toast(e.message, 'err', 5000);
  } finally { S.busy = false; }
}

async function undo() {
  if (S.busy || !S.last) return;
  const rec = S.last;                       // 先抓住，避免下面被清掉
  S.busy = true;
  toast('撤销中…', '', 1200);
  let done = false;
  try {
    const back = joinEnc(rec.backDir, rec.name);
    const tryIt = async (method) => (await fetch(rec.from, { method, credentials:'same-origin',
      headers:{ 'Destination': ORIGIN + back, 'Overwrite':'F' } })).status;
    let st = await tryIt('MOVE');
    if (st === 412) throw new Error('原位置已有同名文件，撤销中止（没有改动任何文件）');
    if (st === 405 || st === 502 || st === 500) {
      st = await tryIt('COPY');
      if (st >= 200 && st < 300) {
        const info = await statOf(ORIGIN + back);
        if (!info) throw new Error('回拷校验失败 —— 原副本仍在目标位置，未删除');
        const d = await fetch(rec.from, { method:'DELETE', credentials:'same-origin' });
        if (d.status !== 204 && d.status !== 200) throw new Error('回拷成功但清理失败，请手动检查');
      }
    }
    if (!(st >= 200 && st < 300)) throw new Error('撤销失败 HTTP ' + st);
    S.last = null;
    done = true;
  } catch (e) {
    toast(e.message, 'err', 5000);
  } finally {
    S.busy = false;                         // ★ 必须先释放，否则下面的 openSource 会被 busy 挡掉
  }
  if (done) {
    toast('已撤销', 'ok', 1600);
    await openSource(S.cwd);                // 此时 busy=false，才会真的重新拉取目录
  }
}

/* ---------------- 设置面板 ---------------- */
function openSetup() {

  $('setupSheet').classList.add('on');
  refreshCounts();
}
function renderSetup() {

      <span class="txt">${val

        : `<span style="color:#63707e">未设置</span>`}</span>`;
    const acts = document.createElement('span'); acts.className = 'acts';

    acts.append(mk('浏览', onBrowse), mk('当前', onCurrent), mk('清', onClear, 'ghost'));

  };

    `· 目标可以是<b>同一块盘上的任意目录</b>（跨目录正常）；与源不同盘的槽位会标 ⚠，那种情况会改用「复制+校验+删除」<br>`
  + `· 配置会<b>保存到 NAS 上本页旁边的 snap-config.json</b>，换设备/换浏览器/清缓存都能沿用<br>`
  + `· 长按或右键槽位也能快速改；「⚙ 批量勾选子目录」可以一次挑多个<br>`
  + `· 当前源在存储池 <b>${esc(srcPool || '—')}</b>`;
}
function setSource(path) { S.source = path ? { path, name: labelOf(path) } : null; scheduleSave(); renderSetup(); renderHeader(); }
function setTarget(i, path) {
  S.targets[i] = path ? { path, name: labelOf(path) } : null;
  scheduleSave(); renderSetup(); renderSlots();
}
function setDel(path) { S.del = path ? { path, name: labelOf(path) } : null; scheduleSave(); renderSetup(); }

  for (let i=0;i<SLOT_N;i++) {
    const t = S.targets[i]; if (!t) continue;
    try { const l = await propfind(ORIGIN + t.path, 1); S.counts[t.path] = (l||[]).filter((e)=>!e.dir).length; renderSlots(); }

/* ---------------- 目录浏览器（选源 / 选槽位 / 批量勾选） ---------------- */
function openPicker(mode, slot) {
  S.pick = { mode, slot, dir:'/', chosen:new Set() };
  $('setupSheet').classList.remove('on');
  $('browseSheet').classList.add('on');
  renderPickerFoot();
  pickerLoad(mode === 'source' ? (S.source ? parentOf(S.source.path) : '/')
            : mode === 'del' ? (S.del ? parentOf(S.del.path) : '/')
            : (S.targets[slot] ? parentOf(S.targets[slot].path) : (S.cwd || '/')));
}

function renderPickerFoot() {
  const m = S.pick.mode;
  $('browseTitle').textContent = m === 'batch' ? '批量勾选子目录' : m === 'source' ? '选择「待分类」目录' : m === 'del' ? '选择「丢弃」目录' : `选择槽位 ${S.pick.slot+1} 的目录`;
  const foot = $('bFoot');
  if (m === 'batch') {
    foot.innerHTML = '';
    const all = document.createElement('button'); all.className='btn ghost'; all.textContent='全选';
    all.onclick = () => { pickerCurrentDirs().forEach((d)=>S.pick.chosen.add(d.href)); renderPickerList(); renderPickerFoot(); };
    const none = document.createElement('button'); none.className='btn ghost'; none.textContent='清空';
    none.onclick = () => { S.pick.chosen.clear(); renderPickerList(); renderPickerFoot(); };
    const add = document.createElement('button'); add.className='btn primary';
    add.textContent = `添加到空槽位 (${S.pick.chosen.size})`;
    add.disabled = S.pick.chosen.size === 0;
    add.onclick = applyBatch;
    foot.append(all, none, add);
  } else {
    foot.innerHTML = '';
    const cancel = document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='取消';
    cancel.onclick = () => $('browseSheet').classList.remove('on');
    const ok = document.createElement('button'); ok.className='btn primary'; ok.textContent='选定此目录';
    ok.onclick = () => { commitPick(S.pick.dir); };
    foot.append(cancel, ok);
    if (m === 'slot') {
      const batch = document.createElement('button'); batch.className='btn'; batch.textContent='☑ 批量';
      batch.onclick = () => { S.pick = { mode:'batch', slot:-1, dir:S.pick.dir, chosen:new Set() }; renderPickerFoot(); pickerLoad(S.pick.dir); };
      foot.insertBefore(batch, ok);
    }
  }
}

let pickerDirs = [];
const pickerCurrentDirs = () => pickerDirs;

async function pickerLoad(dir) {
  S.pick.dir = dir.endsWith('/') ? dir : dir + '/';
  const here = poolOf(S.pick.dir), srcPool = S.cwd ? poolOf(S.cwd) : null;
  const same = !srcPool || here === srcPool;
  $('bCrumb').innerHTML = esc(dec(S.pick.dir))
    + `<span class="pool ${same?'same':'diff'}">${esc(here)}${srcPool ? (same ? ' · 与源同盘' : ' · 与源不同盘 ⚠') : ''}</span>`;
  $('bHint').innerHTML = S.pick.mode === 'batch'
    ? '勾选下面这些子目录，然后点右下角一次加入空槽位。也可以先进到更深的目录再勾。'
    : '点一行进入该目录；也可以直接点「选它」把那个子目录选走。';
  const box = $('bList');
  box.innerHTML = '<div class="note">载入中…</div>';
  try {
    pickerDirs = (await listDirs(S.pick.dir)) || [];
    renderPickerList();
  } catch (e) {
    box.innerHTML = `<div class="note" style="color:#f85149">${esc(e.message)}</div>`;
  }
  renderPickerFoot();
}

function renderPickerList() {
  const box = $('bList'); box.innerHTML = '';
  const batch = S.pick.mode === 'batch';
  if (!pickerDirs.length) {
    box.innerHTML = '<div class="note">这个目录下没有子目录<br>（可以点上面的 ↑ 回上一层）</div>';
    if (batch) updateBatchHint();
    return;
  }
  pickerDirs.forEach((d) => {
    const on = batch && S.pick.chosen.has(d.href);
    const row = document.createElement('div');
    row.className = 'item' + (on ? ' on' : '');

    if (batch) {
      // 左侧方框：只有点它才是「选中/取消」
      const ck = document.createElement('button');
      ck.type = 'button';
      ck.className = 'ck' + (on ? ' on' : '');
      ck.textContent = on ? '✓' : '';
      ck.setAttribute('aria-label', on ? '取消选择' : '选择');
      ck.onclick = (e) => { e.stopPropagation(); toggleChosen(d.href); };
      row.append(ck);
    } else {
      const ico = document.createElement('span');
      ico.className = 'idx'; ico.textContent = '📁';
      row.append(ico);
    }

    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.innerHTML = `<b>${esc(d.name)}</b><span>${esc(dec(d.href))}</span>`;
    row.append(txt);

    if (batch) {
      const chev = document.createElement('span');
      chev.className = 'chev'; chev.textContent = '›';
      row.append(chev);
    } else {
      const acts = document.createElement('span'); acts.className = 'acts';
      const pick = document.createElement('button');
      pick.className = 'btn'; pick.textContent = '选它';
      pick.onclick = (e) => { e.stopPropagation(); commitPick(d.href); };
      acts.append(pick);
      row.append(acts);
    }

    // 点这一行（名字区域）＝进入该目录 —— 批量模式下也一样
    row.onclick = () => pickerLoad(d.href);
    box.append(row);
  });
  if (batch) updateBatchHint();
}

function toggleChosen(href) {
  S.pick.chosen.has(href) ? S.pick.chosen.delete(href) : S.pick.chosen.add(href);
  renderPickerList(); renderPickerFoot();
}

/** 批量模式：把"已选 N 个"写在提示行上，边勾边看得见 */
function updateBatchHint() {
  const n = S.pick.chosen.size;
  $('bHint').innerHTML = `已选 <b style="color:#4c9aff">${n}</b> 个 —— `
    + `点一行＝<b>进入</b>该目录，勾选请点每行<b>左边的方框</b>。`
    + (n ? ' 选好后点右下角一次加入空槽位。' : '');
}

function commitPick(path) {
  if (!path) { toast('请先进入一个目录', 'warn'); return; }
  const m = S.pick.mode;
  if (m === 'source') setSource(path);
  else if (m === 'del') setDel(path);
  else if (m === 'slot') setTarget(S.pick.slot, path);
  $('browseSheet').classList.remove('on');
  $('setupSheet').classList.add('on');
  renderSetup(); renderSlots();
  if (m === 'source') { S.index = 0; openSource(path); }
  refreshCounts();
  toast('已设置（正在保存到 NAS…）', 'ok', 1600);
}

function applyBatch() {
  const chosen = Array.from(S.pick.chosen);
  if (!chosen.length) return;
  const existing = new Set(S.targets.filter(Boolean).map((t)=>t.path));
  let added = 0, dup = 0, full = 0;
  for (const href of chosen) {
    if (existing.has(href)) { dup++; continue; }
    const i = S.targets.findIndex((t) => !t);
    if (i < 0) { full++; continue; }
    S.targets[i] = { path: href, name: labelOf(href) };
    existing.add(href); added++;
  }
  scheduleSave(); renderSetup(); renderSlots();
  $('browseSheet').classList.remove('on');
  $('setupSheet').classList.add('on');
  const bits = [`已加入 ${added} 个`];
  if (dup) bits.push(`跳过 ${dup} 个（已在槽位里）`);
  if (full) bits.push(`${full} 个没地方放（12 个槽位已满）`);
  toast(bits.join('，'), full ? 'warn' : 'ok', 4000);
  refreshCounts();
}

/* ---------------- 事件 ---------------- */
$('srcBtn').onclick = () => openPicker('source', -1);
$('filterChip').onclick = () => setFilter(S.filter === 'all' ? 'image' : S.filter === 'image' ? 'video' : 'all');
['all','image','video'].forEach((k) => { const b = $('filter_' + k); if (b) b.onclick = () => setFilter(k); });
$('undo').onclick = undo;
$('discard').onclick = () => {
  if (!S.del) { toast('还没设置「丢弃」目录，去 ⚙ 设置里选一个', 'warn'); openSetup(); return; }
  if (S.cwd && poolOf(S.del.path) !== poolOf(S.cwd)) toast('注意：丢弃目录在另一块盘，将用复制方式完成', 'warn');
  classify(S.del, null);
};
$('setup').onclick = openSetup;
$('batchBtn').onclick = () => openPicker('batch', -1);
$('fillBtn').onclick = () => {
  if (!S.cwd) { toast('先选一个待分类目录', 'warn'); return; }
  let n = 0;
  for (const d of S.dirs) {
    if (S.targets.every((t)=>t)) break;
    if (S.targets.some((t)=>t && t.path === d.href)) continue;
    const i = S.targets.findIndex((t)=>!t);
    if (i < 0) break;
    S.targets[i] = { path:d.href, name:d.name }; n++;
  }
  scheduleSave(); renderSetup(); renderSlots();
  toast(n ? `用当前目录的子目录填充了 ${n} 个空槽位` : '没有可填充的子目录（或槽位已满）', n ? 'ok' : 'warn');
  refreshCounts();
};
$('clearAll').onclick = () => {
  if (!confirm('清空全部目录设置（源、12 个目标、丢弃）？\n只会清配置，不会动任何文件。')) return;
  S.source = null; S.targets = new Array(SLOT_N).fill(null); S.del = null;
  scheduleSave(); renderSetup(); renderSlots(); renderHeader();
  toast('已清空设置', 'ok');
};
$('reloadCfg').onclick = async () => { await loadConfig(); renderSetup(); renderSlots(); renderHeader(); if (S.source) openSource(S.source.path); };
// 槽位区滚动时更新"下面还有"的渐隐提示
$('slotsWrap').addEventListener('scroll', updateSlotsFade, { passive: true });
window.addEventListener('resize', updateSlotsFade);
document.querySelectorAll('[data-close]').forEach((b) => {
  b.onclick = () => {
    $(b.dataset.close).classList.remove('on');
    if (b.dataset.close === 'browseSheet' && S.pick.mode !== 'batch') $('setupSheet').classList.add('on');
  };
});

$('bUp').onclick = () => { if (S.pick.dir !== '/') pickerLoad(parentOf(S.pick.dir)); };
$('bHome').onclick = () => pickerLoad('/');
$('bReload').onclick = () => pickerLoad(S.pick.dir);

document.addEventListener('keydown', (e) => {
  if ($('setupSheet').classList.contains('on') || $('browseSheet').classList.contains('on')) return;
  if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (S.index < S.files.length-1) { S.index++; renderStage(); renderFilm(); preload(); } }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (S.index > 0) { S.index--; renderStage(); renderFilm(); preload(); } }
  else if (/^[1-9]$/.test(e.key)) { const t = S.targets[Number(e.key)-1]; if (t) classify(t, document.querySelector(`.slot[data-slot="${Number(e.key)-1}"]`)); }
});

/* ---------------- 启动 ---------------- */
(async function boot() {
  // 先用浏览器缓存（配置 + 媒体类型）瞬间渲染，再以 NAS 上的配置为准
  try { applyConfig(JSON.parse(localStorage.getItem(CFG_LS) || 'null')); } catch(e){}
  try { const lf = localStorage.getItem(FILTER_LS); if (lf) S.filter = lf; } catch(e){}
  buildSlots();                 // 20 个槽位只创建一次，后续原地更新（滚动位置才不会跳）
  updateFilterUI();
  renderSlots(); renderHeader();
  setSync('on', '载入配置…');
  await loadConfig();
  renderSlots(); renderHeader();
  const start = (S.source && S.source.path) || DIR;
  if (S.source && S.source.path) setSync('ok', '已同步');
  await openSource(start);
  if (!S.dirty) setSync('ok', '已同步');
  refreshCounts();
})();
</script>
</body>
</html>
