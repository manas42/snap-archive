<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片快速分类器 · Snap Archive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📁</span>
      <span class="brand-title">图片快速分类器</span>
    </div>
    <div class="source-info" id="sourceInfo" hidden>
      <span class="source-name" id="sourceName"></span>
      <button class="btn" id="changeSourceBtn" type="button">更换文件夹</button>
      <button class="btn" id="gridBtn" type="button">图集</button>
      <select class="filter-select" id="filterSelect" title="过滤源文件夹中的文件类型">
        <option value="all">图片+视频</option>
        <option value="image">仅图片</option>
        <option value="video">仅视频</option>
      </select>
      <label class="autoplay-toggle" title="主图视频自动播放；左右预览图总是不自动播放">
        <input type="checkbox" id="autoplayCheck" />
        <span>自动播放</span>
      </label>
    </div>
    <div class="top-actions">
      <div class="stats" id="stats"></div>
      <button class="btn" id="undoBtn" type="button" title="撤销上一次移动（Ctrl+Z）" disabled>↶ 撤销</button>
      <button class="btn" id="clearTargetsBtn" type="button">清空目标</button>
      <button class="btn danger" id="clearBtn" type="button" title="清空浏览器中保存的全部文件夹记录并重置界面（磁盘文件不受影响）">清除缓存</button>
    </div>
  </header>

  <div class="restore-banner" id="restoreBanner" hidden>
    <span class="restore-text" id="restoreText"></span>
    <div class="restore-actions">
      <button class="btn" id="restoreBtn" type="button">恢复</button>
      <button class="btn dismiss" id="dismissRestoreBtn" type="button">暂不</button>
    </div>
  </div>

  <main class="layout">
    <!-- 左侧预览区：占满尺寸的画布（80% 宽度），空态与预览态为同一区域 -->
    <section class="preview-pane" id="previewPane">
      <div class="canvas" id="canvas">
        <div class="dropzone" id="sourceDrop">
          <div class="dz-icon">🖼️</div>
          <div class="dz-title">拖入「待分类」文件夹</div>
          <div class="dz-hint">或点击选择 · 仅读取该文件夹（不含子文件夹）</div>
        </div>

        <div class="preview" id="preview" hidden>
          <div class="preview-stage" id="previewStage"></div>
          <div class="file-chip" id="fileChip" hidden></div>
        </div>
      </div>
    </section>

    <!-- 右侧目标区：20% 宽度，10 个可排序槽位 + 1 个固定 Del 槽位 -->
    <aside class="target-pane" id="targetPane"></aside>
  </main>

  <footer class="hintbar">
    <span class="hint"><kbd>空格</kbd> / <kbd>→</kbd> 下一张</span>
    <span class="hint"><kbd>←</kbd> 上一张</span>
    <span class="hint"><kbd>0</kbd>–<kbd>9</kbd> 移入对应文件夹</span>
    <span class="hint"><kbd>Del</kbd> 移入固定文件夹</span>
    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</span>
  </footer>

  <div class="toast" id="toast" hidden></div>

  <!-- 图集模态框：5×4 栅格分页浏览源文件夹图片 -->
  <div class="modal" id="gridModal" hidden>
    <div class="modal-overlay" id="gridOverlay">
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title" id="gridTitle">图集</span>
          <button class="btn modal-close" id="gridClose" type="button" title="关闭（Esc）">✕</button>
        </div>
        <div class="modal-body grid" id="gridBox"></div>
        <div class="modal-foot">
          <div class="grid-sort">
            <span class="sort-label">排序</span>
            <button class="btn grid-sort-btn" id="gridSortNew" type="button" title="按修改时间：最新在前">新 → 旧</button>
            <button class="btn grid-sort-btn" id="gridSortOld" type="button" title="按修改时间：最早在前">旧 → 新</button>
          </div>
          <div class="foot-nav">
            <button class="btn" id="gridPrev" type="button">‹ 上一页</button>
            <span class="page-info" id="gridPageInfo"></span>
            <button class="btn" id="gridNext" type="button">下一页 ›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
